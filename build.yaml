targets:
  $default:
    builders:
      json_serializable:
        options:
          # JSON keys match Supabase snake_case column names.
          field_rename: snake
          explicit_to_json: true
          include_if_null: true
      freezed:
        options:
          # toString/== /copyWith are generated; keep maps/lists unmodifiable.
          make_collections_unmodifiable: true
