# Supabase CLI configuration (local development stack: `supabase start`).
# Only settings that differ from or matter for this app are listed; everything
# else uses the CLI defaults. Hosted projects ignore this file except for
# `supabase link` / `db push`, which read `project_id` and `[db]`.
project_id = "quiz_app"

[api]
enabled = true
port = 54321
# PostgREST only exposes these schemas. `private` (internal helpers) must stay
# out of this list.
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[db.seed]
enabled = false

[realtime]
enabled = false

[studio]
enabled = true
port = 54323

[storage]
enabled = true
file_size_limit = "10MiB"

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000", "io.supabase.quizapp://login-callback"]
jwt_expiry = 3600
enable_signup = true

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = false
